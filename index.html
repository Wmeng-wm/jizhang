<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账">
<meta name="theme-color" content="#4F6EF7">
<title>记账</title>
<style>
:root {
  --primary: #4F6EF7;
  --danger: #FF6B6B;
  --success: #34C759;
  --warning: #FF9F0A;
  --bg: #F5F6FA;
  --card: rgba(255,255,255,0.55);
  --text: #1C1C1E;
  --text-secondary: #8E8E93;
  --text-light: #C7C7CC;
  --border: rgba(255,255,255,0.6);
  --safe-bottom: env(safe-area-inset-bottom, 16px);
  --tab-height: calc(56px + var(--safe-bottom));
  --glass-blur: blur(30px) saturate(180%);
  --glass-border: 0.5px solid rgba(255,255,255,0.6);
  --glass-shadow: 0 4px 20px rgba(80,90,160,0.10), inset 0 1px 0 rgba(255,255,255,0.75);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  background: linear-gradient(165deg, #DCE6FF 0%, #EFE9FF 38%, #E3F4FF 72%, #EAF9F1 100%);
  background-attachment: fixed;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  min-height: 100vh;
  min-height: 100dvh;
}

#app {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  background: transparent;
}

/* Header */
.header {
  position: sticky;
  top: 0;
  padding: 12px 20px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  background: rgba(255,255,255,0.45);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-bottom: var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 50;
}
.header h1 { font-size: 18px; font-weight: 600; }
.header-month {
  font-size: 14px;
  color: var(--text-secondary);
  background: rgba(255,255,255,0.5);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  padding: 4px 12px;
  border-radius: 20px;
  border: var(--glass-border);
}

/* Account Switch in Header */
.account-switch {
  display: flex;
  background: rgba(120,130,180,0.12);
  border: var(--glass-border);
  border-radius: 14px;
  padding: 3px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.account-switch button {
  padding: 6px 14px;
  border: none;
  border-radius: 11px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  background: transparent;
  color: var(--text-secondary);
  transition: all 0.15s;
}
.account-switch button.active {
  background: rgba(255,255,255,0.85);
  color: var(--text);
  box-shadow: 0 2px 8px rgba(0,0,0,0.08), inset 0 0.5px 0 rgba(255,255,255,0.9);
}

/* Pages */
.page { display: none; }
.page.active { display: block; padding-bottom: calc(96px + var(--safe-bottom)); }

/* ── Home Page ── */
.account-cards {
  display: flex;
  gap: 12px;
  margin: 16px;
}
.account-card {
  flex: 1;
  background: var(--card);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-radius: 22px;
  padding: 16px;
  cursor: pointer;
  border: var(--glass-border);
  box-shadow: var(--glass-shadow);
  transition: all 0.15s;
  position: relative;
}
.account-card.active { border-color: var(--primary); box-shadow: 0 4px 20px rgba(79,110,247,0.25), inset 0 1px 0 rgba(255,255,255,0.75); }
.account-card:active { transform: scale(0.97); }
.account-card .card-icon { font-size: 24px; margin-bottom: 4px; }
.account-card .card-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
}
.account-card .card-balance {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 8px;
}
.account-card .card-row {
  display: flex;
  gap: 10px;
  font-size: 11px;
  color: var(--text-secondary);
}
.account-card .card-row .in { color: var(--success); }
.account-card .card-row .out { color: var(--text-secondary); }
.account-card .card-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--primary);
  display: none;
}
.account-card.active .card-badge { display: block; }

.quick-actions {
  display: flex; gap: 12px; padding: 0 16px; margin-bottom: 16px;
}
.quick-btn {
  flex: 1; padding: 14px; border-radius: 16px; border: none;
  font-size: 15px; font-weight: 600; color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: transform 0.15s, opacity 0.15s;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.3);
}
.quick-btn:active { transform: scale(0.97); opacity: 0.9; }
.quick-btn.expense { background: linear-gradient(135deg, #FF8A8A, var(--danger)); }
.quick-btn.income { background: linear-gradient(135deg, #5BD97A, var(--success)); }
.quick-btn .acct-label {
  font-size: 11px;
  font-weight: 400;
  opacity: 0.85;
}

.section-title {
  font-size: 15px; font-weight: 600; padding: 0 20px; margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.section-title .view-all { font-size: 13px; color: var(--text-secondary); font-weight: 400; cursor: pointer; }

/* 本月消费趋势卡 */
.trend-card {
  margin: 0 16px 8px; padding: 20px;
  background: var(--card);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: var(--glass-border);
  border-radius: 22px;
  box-shadow: var(--glass-shadow);
}
.trend-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.trend-amount { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
.trend-unit { font-size: 14px; color: var(--text-secondary); }
.trend-sub { display: flex; gap: 14px; font-size: 12px; color: var(--text-secondary); margin-bottom: 18px; }
.trend-sub b { color: var(--text); font-weight: 600; }
.trend-chart {
  display: flex; align-items: flex-end; gap: 8px; height: 110px;
  padding: 0 2px;
}
.trend-col {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 6px; height: 100%; justify-content: flex-end;
}
.trend-bar-wrap { width: 100%; flex: 1; display: flex; align-items: flex-end; }
.trend-bar {
  width: 100%; border-radius: 7px 7px 4px 4px;
  background: linear-gradient(180deg, #7B93FF, var(--primary));
  min-height: 4px;
  box-shadow: 0 2px 8px rgba(79,110,247,0.25);
  transition: height 0.4s ease;
}
.trend-col.today .trend-bar { background: linear-gradient(180deg, #FF9F0A, #FF7A1A); box-shadow: 0 2px 8px rgba(255,154,26,0.35); }
.trend-day { font-size: 10px; color: var(--text-light); }
.trend-col.today .trend-day { color: var(--warning); font-weight: 600; }
.trend-amt { font-size: 9px; color: var(--text-light); white-space: nowrap; transform: scale(0.95); }
.trend-col.today .trend-amt { color: var(--warning); }

.tx-item {
  display: flex; align-items: center; padding: 14px 20px;
  background: var(--card);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  margin: 0 16px 8px; border-radius: 18px;
  border: var(--glass-border);
  box-shadow: var(--glass-shadow);
  transition: transform 0.15s;
}
.tx-item:active { transform: scale(0.98); }
.tx-icon {
  width: 42px; height: 42px; border-radius: 13px; display: flex;
  align-items: center; justify-content: center; font-size: 22px;
  margin-right: 12px; flex-shrink: 0;
  background: rgba(255,255,255,0.6);
  border: 0.5px solid rgba(255,255,255,0.8);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
}
.ico { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; }
.tx-info { flex: 1; min-width: 0; }
.tx-category { font-size: 15px; font-weight: 500; }
.tx-date { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.tx-amount { font-size: 17px; font-weight: 600; text-align: right; white-space: nowrap; }
.tx-amount.expense { color: var(--text); }
.tx-amount.income { color: var(--success); }
.tx-note { font-size: 12px; color: var(--text-secondary); }
.tx-meta { text-align: right; }
.tx-acct-tag {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  margin-left: 6px;
}
.tx-acct-tag.personal { background: #F0F3FF; color: #4F6EF7; }
.tx-acct-tag.work { background: #FFF7E6; color: #E6A23C; }

.empty-state {
  text-align: center; padding: 40px 20px; color: var(--text-light);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; }

/* ── History Page ── */
.filter-bar {
  display: flex; gap: 8px; padding: 12px 16px; background: rgba(255,255,255,0.45);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  border-bottom: var(--glass-border);
}
.filter-chip {
  padding: 6px 14px; border-radius: 20px; font-size: 13px;
  border: var(--glass-border); background: rgba(255,255,255,0.5); color: var(--text-secondary);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  white-space: nowrap; cursor: pointer; transition: all 0.15s;
}
.filter-chip.active { background: linear-gradient(135deg, #7B93FF, var(--primary)); color: #fff; border-color: transparent; box-shadow: 0 3px 10px rgba(79,110,247,0.3); }

.month-header {
  font-size: 14px; font-weight: 600; color: var(--text-secondary);
  padding: 12px 20px 8px;
}

/* 分类筛选汇总条 */
.filter-summary {
  display: flex; align-items: center; gap: 10px;
  margin: 12px 16px 4px; padding: 12px 16px;
  background: var(--card);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: var(--glass-border);
  border-radius: 16px;
  box-shadow: var(--glass-shadow);
}
.filter-summary .fs-icon {
  width: 36px; height: 36px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.6);
  border: 0.5px solid rgba(255,255,255,0.8);
  font-size: 19px; flex-shrink: 0;
}
.filter-summary .fs-info { flex: 1; min-width: 0; }
.filter-summary .fs-name { font-size: 14px; font-weight: 600; }
.filter-summary .fs-count { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.filter-summary .fs-total { font-size: 18px; font-weight: 700; flex-shrink: 0; }

/* ── Statistics Page ── */
.billing-banner {
  margin: 16px;
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
}
.billing-banner.personal {
  background: rgba(255,247,230,0.7);
  border: 1px solid rgba(255,232,179,0.9);
  color: #E6A23C;
}
.billing-banner.work {
  background: rgba(240,243,255,0.7);
  border: 1px solid rgba(208,216,255,0.9);
  color: #4F6EF7;
}
.billing-banner .billing-date { font-weight: 600; }

.stats-header {
  padding: 20px; background: var(--card);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  margin: 16px;
  border-radius: 22px;
  border: var(--glass-border);
  box-shadow: var(--glass-shadow);
  display: flex; justify-content: space-around;
  text-align: center;
}
.stats-header .stat-item .val { font-size: 22px; font-weight: 700; }
.stats-header .stat-item .lbl { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.stats-header .stat-divider { width: 1px; background: rgba(0,0,0,0.08); }

.chart-container {
  margin: 0 16px 16px; padding: 20px; background: var(--card);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-radius: 22px;
  border: var(--glass-border);
  box-shadow: var(--glass-shadow);
}
.chart-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; }

.cat-rank { margin: 0 16px 16px; }
.cat-rank-item {
  display: flex; align-items: center; padding: 10px 16px; background: var(--card);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-radius: 14px; margin-bottom: 6px; gap: 12px;
  border: var(--glass-border);
  box-shadow: var(--glass-shadow);
}
.cat-rank-bar-bg {
  flex: 1; height: 8px; background: rgba(0,0,0,0.06); border-radius: 4px; overflow: hidden;
}
.cat-rank-bar { height: 100%; border-radius: 4px; transition: width 0.3s; }
.cat-rank-amount { font-size: 14px; font-weight: 600; min-width: 70px; text-align: right; }
.cat-rank-pct { font-size: 12px; color: var(--text-secondary); min-width: 44px; text-align: right; }

/* Date range picker for work stats */
.date-range-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 16px 16px;
  padding: 12px;
  background: var(--card);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-radius: 16px;
  border: var(--glass-border);
  box-shadow: var(--glass-shadow);
}
.date-range-row input {
  flex: 1;
  padding: 10px 12px;
  border: var(--glass-border);
  border-radius: 10px;
  font-size: 14px;
  outline: none;
  -webkit-appearance: none;
  min-width: 0;
  background: rgba(255,255,255,0.6);
}
.date-range-row .sep { color: var(--text-light); font-size: 14px; flex-shrink: 0; }
.date-range-row .gen-btn {
  padding: 10px 16px;
  background: linear-gradient(135deg, #7B93FF, var(--primary));
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  box-shadow: 0 3px 10px rgba(79,110,247,0.3);
}
.date-range-row .gen-btn:active { opacity: 0.85; }

.stat-empty {
  text-align: center;
  padding: 30px;
  color: var(--text-light);
  font-size: 14px;
}

/* ── Settings Page ── */
.settings-group { margin: 16px; background: var(--card); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border-radius: 22px; overflow: hidden; border: var(--glass-border); box-shadow: var(--glass-shadow); }
.settings-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid rgba(0,0,0,0.06); cursor: pointer;
}
.settings-item:last-child { border-bottom: none; }
.settings-item:active { background: rgba(255,255,255,0.5); }
.settings-item .left { display: flex; align-items: center; gap: 12px; }
.settings-item .left .icon { font-size: 20px; }
.settings-item .left .info { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.settings-item .right { color: var(--text-light); font-size: 14px; }
.settings-item .val { color: var(--text-secondary); font-size: 14px; }
.settings-item.danger .left { color: var(--danger); }

/* ── Add Modal ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(30,32,48,0.45);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 100; justify-content: center; align-items: flex-end;
}
.modal-overlay.show { display: flex; }
.modal {
  width: 100%; max-width: 430px; background: rgba(248,249,253,0.85);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border-radius: 28px 28px 0 0; padding: 8px 20px;
  border-top: 0.5px solid rgba(255,255,255,0.7);
  padding-bottom: calc(20px + var(--safe-bottom));
  animation: slideUp 0.25s ease;
  box-shadow: 0 -8px 40px rgba(0,0,0,0.12);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 36px; height: 4px; background: rgba(0,0,0,0.12); border-radius: 2px; margin: 0 auto 16px; }
.modal-title { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 8px; }
.modal-acct-hint {
  text-align: center;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 16px;
}
.modal-acct-hint span {
  padding: 2px 8px;
  border-radius: 6px;
  font-weight: 500;
  background: rgba(255,255,255,0.7);
  border: 0.5px solid rgba(255,255,255,0.9);
}
.modal-acct-hint span.personal { background: rgba(240,243,255,0.8); color: #4F6EF7; }
.modal-acct-hint span.work { background: rgba(255,247,230,0.8); color: #E6A23C; }

.modal .type-toggle {
  display: flex; background: rgba(120,130,180,0.12); border: var(--glass-border); border-radius: 14px; padding: 3px; margin-bottom: 20px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.modal .type-toggle button {
  flex: 1; padding: 10px; border: none; border-radius: 11px;
  font-size: 15px; font-weight: 500; cursor: pointer; background: transparent;
  color: var(--text-secondary); transition: all 0.15s;
}
.modal .type-toggle button.active { background: rgba(255,255,255,0.9); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.08), inset 0 0.5px 0 rgba(255,255,255,0.9); }

.modal .amount-input {
  width: 100%; border: none; font-size: 40px; font-weight: 700;
  text-align: center; padding: 16px 0; outline: none; letter-spacing: -1px;
  background: transparent;
  color: var(--text);
}
.modal .amount-input::placeholder { color: var(--text-light); }

.modal .category-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px;
  max-height: 220px; overflow-y: auto;
}
.modal .cat-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 4px; border-radius: 14px; cursor: pointer; transition: all 0.15s;
  border: 0.5px solid transparent;
}
.modal .cat-item.selected { border-color: var(--primary); background: rgba(79,110,247,0.12); box-shadow: 0 2px 10px rgba(79,110,247,0.15); }
.modal .cat-item:active { transform: scale(0.95); }
.modal .cat-item .icon {
  width: 44px; height: 44px; border-radius: 14px; display: flex;
  align-items: center; justify-content: center; font-size: 24px;
  background: rgba(255,255,255,0.7);
  border: 0.5px solid rgba(255,255,255,0.9);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
}
.modal .cat-item .name { font-size: 11px; color: var(--text-secondary); }

.modal .note-input {
  width: 100%; border: var(--glass-border); border-radius: 14px;
  padding: 12px; font-size: 14px; outline: none; margin-bottom: 16px;
  background: rgba(255,255,255,0.6);
}
.modal .date-input {
  width: 100%; border: var(--glass-border); border-radius: 14px;
  padding: 12px; font-size: 14px; outline: none; margin-bottom: 20px;
  -webkit-appearance: none;
  background: rgba(255,255,255,0.6);
}
.modal .save-btn {
  width: 100%; padding: 16px; background: linear-gradient(135deg, #7B93FF, var(--primary));
  color: #fff;
  border: none; border-radius: 16px; font-size: 17px; font-weight: 600;
  cursor: pointer; margin-bottom: 8px; transition: all 0.15s;
  box-shadow: 0 4px 16px rgba(79,110,247,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
}
.modal .save-btn:active { opacity: 0.85; transform: scale(0.98); }
.modal .save-btn:disabled { opacity: 0.4; }

/* ── Tab Bar ── */
.tab-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: flex; gap: 2px;
  margin: 0 auto calc(12px + var(--safe-bottom));
  max-width: 430px;
  padding: 8px 22px;
  background: rgba(250,250,252,0.30);
  backdrop-filter: saturate(180%) blur(28px);
  -webkit-backdrop-filter: saturate(180%) blur(28px);
  border-radius: 26px;
  border: 0.5px solid rgba(255,255,255,0.5);
  box-shadow: 0 8px 24px rgba(0,0,0,0.10), inset 0 0 0 0.5px rgba(255,255,255,0.6);
  box-sizing: border-box;
}
.tab-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 8px 0 6px; border: none; background: none; cursor: pointer;
  color: var(--text); font-size: 10px; gap: 3px;
  border-radius: 20px;
  transition: color 0.2s, background 0.2s, transform 0.2s;
}
.tab-btn .tab-icon {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 11px;
  background: linear-gradient(145deg, rgba(255,255,255,0.55), rgba(255,255,255,0.10));
  border: 0.5px solid rgba(255,255,255,0.6);
  box-shadow: 0 1px 4px rgba(0,0,0,0.06), inset 0 1px 1px rgba(255,255,255,0.7);
  transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
}
.tab-btn .tab-icon { position: relative; }
.tab-btn .tab-icon .i-f { position: absolute; }
.tab-btn .tab-icon svg { width: 19px; height: 19px; }
.tab-btn .tab-icon .i-o { opacity: 1; transition: opacity 0.18s ease, transform 0.22s ease; }
.tab-btn .tab-icon .i-f { opacity: 0; transform: scale(0.5); transition: opacity 0.18s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
.tab-btn.active {
  color: var(--primary);
  background: rgba(79,110,247,0.10);
}
.tab-btn.active .tab-icon .i-o { opacity: 0; transform: scale(0.5); }
.tab-btn.active .tab-icon .i-f { opacity: 1; transform: scale(1); }
.tab-btn.active .tab-icon {
  background: linear-gradient(145deg, rgba(79,110,247,0.30), rgba(79,110,247,0.08));
  border-color: rgba(79,110,247,0.35);
  box-shadow: 0 2px 8px rgba(79,110,247,0.25), inset 0 1px 1px rgba(255,255,255,0.45);
}
.tab-btn:active { transform: scale(0.92); }

/* Toast */
.toast {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.8); color: #fff; padding: 10px 24px;
  border-radius: 20px; font-size: 14px; z-index: 200; opacity: 0;
  transition: opacity 0.25s; pointer-events: none;
}
.toast.show { opacity: 1; }
.tx-item { position: relative; }
.tx-item .delete-btn {
  position: absolute;
  right: 4px;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 50%;
  background: rgba(245, 108, 108, 0.12);
  color: #F56C6C;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
  transition: all 0.15s;
}
.delete-btn:hover {
  background: #F56C6C;
  color: #fff;
}
.detail-overlay { display: none; position: fixed; inset: 0; background: rgba(30,32,48,0.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 100; justify-content: center; align-items: flex-end; }.detail-overlay.show { display: flex; }
.detail-modal { width: 100%; max-width: 430px; background: rgba(248,249,253,0.85); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); border-radius: 28px 28px 0 0; padding: 8px 20px; border-top: 0.5px solid rgba(255,255,255,0.7); padding-bottom: calc(20px + var(--safe-bottom)); animation: slideUp 0.25s ease; box-shadow: 0 -8px 40px rgba(0,0,0,0.12); }
.detail-handle { width: 36px; height: 4px; background: rgba(0,0,0,0.12); border-radius: 2px; margin: 0 auto 16px; }
.detail-record { display: flex; align-items: center; padding: 16px; background: rgba(255,255,255,0.65); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border-radius: 18px; margin-bottom: 16px; border: var(--glass-border); box-shadow: var(--glass-shadow); }
.detail-record .dr-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 26px; margin-right: 14px; flex-shrink: 0; background: rgba(255,255,255,0.7); border: 0.5px solid rgba(255,255,255,0.9); }
.detail-record .dr-info { flex: 1; }
.detail-record .dr-cat { font-size: 16px; font-weight: 600; }
.detail-record .dr-date { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.detail-record .dr-amount { font-size: 22px; font-weight: 700; }
.detail-record .dr-amount.expense { color: var(--text); }
.detail-record .dr-amount.income { color: var(--success); }
.detail-stats-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.detail-stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.detail-stat-card { background: rgba(255,255,255,0.65); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border-radius: 14px; padding: 12px; text-align: center; border: var(--glass-border); }
.detail-stat-card .ds-val { font-size: 18px; font-weight: 700; }
.detail-stat-card .ds-val.expense { color: var(--text); }
.detail-stat-card .ds-val.income { color: var(--success); }
.detail-stat-card .ds-lbl { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
.detail-cat-list { margin-bottom: 16px; }
.detail-cat-item { display: flex; align-items: center; padding: 10px 12px; background: rgba(255,255,255,0.65); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border-radius: 12px; margin-bottom: 4px; gap: 10px; border: var(--glass-border); }
.detail-cat-bar-bg { flex: 1; height: 6px; background: rgba(0,0,0,0.06); border-radius: 3px; overflow: hidden; }
.detail-cat-bar { height: 100%; border-radius: 3px; }
.detail-cat-amt { font-size: 13px; font-weight: 600; min-width: 60px; text-align: right; }
.detail-cat-pct { font-size: 11px; color: var(--text-secondary); min-width: 36px; text-align: right; }
.detail-close-btn { width: 100%; padding: 14px; background: rgba(255,255,255,0.7); border: var(--glass-border); border-radius: 16px; font-size: 15px; font-weight: 500; color: var(--text-secondary); cursor: pointer; backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); }
.detail-close-btn:active { opacity: 0.7; }
.detail-actions { display: flex; gap: 10px; margin-bottom: 16px; }
.detail-action-btn { flex: 1; padding: 13px; border: none; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.15s; }
.detail-action-btn:active { transform: scale(0.97); opacity: 0.85; }
.detail-action-btn .ico { width: 17px; height: 17px; }
.detail-action-btn.edit { background: linear-gradient(135deg, #7B93FF, var(--primary)); color: #fff; box-shadow: 0 4px 16px rgba(79,110,247,0.35), inset 0 1px 0 rgba(255,255,255,0.3); }
.detail-action-btn.del { background: rgba(255,107,107,0.12); color: var(--danger); border: 0.5px solid rgba(255,107,107,0.35); }
.detail-cat-summary { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--card); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: var(--glass-border); border-radius: 16px; margin-bottom: 16px; box-shadow: var(--glass-shadow); }
.detail-cat-summary .cs-icon { width: 36px; height: 36px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; background: rgba(255,255,255,0.6); border: 0.5px solid rgba(255,255,255,0.8); }
.detail-cat-summary .cs-info { flex: 1; }
.detail-cat-summary .cs-name { font-size: 14px; font-weight: 600; }
.detail-cat-summary .cs-count { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }
.detail-cat-summary .cs-total { font-size: 18px; font-weight: 700; }
.swipe-container{position:relative;overflow:hidden;margin:0 16px 8px;border-radius:18px;background:var(--card);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:var(--glass-border);box-shadow:var(--glass-shadow)}.swipe-content{position:relative;z-index:1;background:var(--card);transition:transform .2s ease;border-radius:18px}.swipe-content.swiped{transform:translateX(-144px)}.swipe-delete{position:absolute;right:0;top:0;bottom:0;width:144px;display:flex;z-index:0;border-radius:0 18px 18px 0;overflow:hidden}.swipe-btn{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;cursor:pointer;border:none}.swipe-btn.edit{background:linear-gradient(135deg,#7B93FF,var(--primary))}.swipe-btn.del{background:linear-gradient(135deg,#FF8A8A,var(--danger))}
.swipe-container .tx-item{margin:0!important}
/* Month nav */.month-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:rgba(255,255,255,0.45);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-bottom:var(--glass-border)}.month-nav button{background:none;border:none;font-size:20px;padding:4px 12px;cursor:pointer;color:var(--primary);border-radius:10px}.month-nav button:active{background:rgba(255,255,255,0.5)}.month-nav .month-label{font-size:15px;font-weight:600}/* Search */.search-bar{padding:8px 16px;background:rgba(255,255,255,0.45);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-bottom:var(--glass-border)}.search-bar input{width:100%;padding:8px 12px;border:var(--glass-border);border-radius:12px;font-size:14px;outline:none;background:rgba(255,255,255,0.6)}/* Edit */.detail-edit-btn{width:100%;padding:12px;background:linear-gradient(135deg,#7B93FF,var(--primary));color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:12px;box-shadow:0 4px 16px rgba(79,110,247,0.35), inset 0 1px 0 rgba(255,255,255,0.3)}.detail-edit-btn:active{opacity:.85}</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>记账</h1>
    <div class="account-switch" id="accountSwitch">
      <button data-acct="personal" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px;margin-right:3px"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-3.5 3.6-5.5 8-5.5s8 2 8 5.5"/></svg>个人</button>
      <button data-acct="work"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px;margin-right:3px"><rect x="3" y="7.5" width="18" height="13" rx="2.5"/><path d="M9 7.5V6a3 3 0 016 0v1.5"/><path d="M3 13h18"/></svg>工作</button>
    </div>
  </div>

  <!-- 首页 -->
  <div class="page active" id="page-home">
    <div class="account-cards" id="accountCards"></div>
    <div class="quick-actions">
      <button class="quick-btn expense" onclick="openModal('expense')">
        − 记支出<span class="acct-label" id="expenseAcctLabel"></span>
      </button>
      <button class="quick-btn income" onclick="openModal('income')">
        + 记收入<span class="acct-label" id="incomeAcctLabel"></span>
      </button>
    </div>
    <div class="section-title">
      <span>本月概览</span>
      <span class="view-all" onclick="switchTab('stats')">详细统计 →</span>
    </div>
    <div id="trendCard"></div>
  </div>

  <!-- 明细 -->
  <div class="page" id="page-history">
    
    <div class="month-nav" id="monthNav">
      <button onclick="prevMonth()">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button onclick="nextMonth()">›</button>
    </div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="搜索备注、分类、金额..." oninput="onSearch()">
    </div>
<div class="filter-bar" id="filterBar">
      <button class="filter-chip active" data-filter="all">全部</button>
      <button class="filter-chip" data-filter="expense">支出</button>
      <button class="filter-chip" data-filter="income">收入</button>
    </div>
    <div id="historyList"></div>
  </div>

  <!-- 统计 -->
  <div class="page" id="page-stats">
    <div id="statsContent"></div>
  </div>

  <!-- 我的 -->
  <div class="page" id="page-settings">
    <div class="settings-group">
      <div class="settings-item" id="syncPairItem" onclick="generateSyncCode()">
        <div class="left"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><rect x="3" y="11" width="18" height="10" rx="2.5"/><path d="M7 11V7.5a5 5 0 0110 0V11"/><path d="M12 15v2.5"/></svg></span><div>同步设备<span class="info" id="syncPairInfo">生成同步码，另一台设备输入后实时同步</span></div></div>
        <div class="right" id="syncPairStatus"></div>
      </div>
      <div class="settings-item" onclick="enterSyncCode()">
        <div class="left"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M8 7V5a4 4 0 018 0v2"/><rect x="4" y="7" width="16" height="14" rx="3"/><path d="M12 11v5M9.5 13.5L12 11l2.5 2.5"/></svg></span><div>输入同步码<span class="info">填写另一台设备生成的同步码</span></div></div>
        <div class="right">›</div>
      </div>
    </div>
    <div class="settings-group">
      <div class="settings-item" onclick="exportAccount('personal')">
        <div class="left"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-3.5 3.6-5.5 8-5.5s8 2 8 5.5"/></svg></span><div>导出个人账单<span class="info">CSV · 可分享到微信/文件</span></div></div>
        <div class="right">›</div>
      </div>
      <div class="settings-item" onclick="exportAccount('work')">
        <div class="left"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><rect x="3" y="7.5" width="18" height="13" rx="2.5"/><path d="M9 7.5V6a3 3 0 016 0v1.5"/><path d="M3 13h18"/></svg></span><div>导出工作账单<span class="info">CSV · 可分享到微信/文件</span></div></div>
        <div class="right">›</div>
      </div>
      <div class="settings-item" onclick="exportAccount('all')">
        <div class="left"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 15l4-4 3 3 5-6"/><path d="M15 8h5v5"/></svg></span><div>导出全部账单<span class="info">包含个人和工作的所有记录</span></div></div>
        <div class="right">›</div>
      </div>
      <div class="settings-item" onclick="exportBackup()">
        <div class="left"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M4 8V5.5A1.5 1.5 0 015.5 4h13A1.5 1.5 0 0120 5.5V8"/><path d="M4 8h16v10.5a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 18.5V8z"/><path d="M12 12v5M9.5 14.5L12 17l2.5-2.5"/></svg></span><div>导出备份<span class="info">JSON 格式 · 迁移数据用</span></div></div>
        <div class="right">›</div>
      </div>
      <div class="settings-item" onclick="document.getElementById('backupInput').click()">
        <div class="left"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M4 16V18.5A1.5 1.5 0 005.5 20h13a1.5 1.5 0 001.5-1.5V16"/><path d="M4 16h16V5.5A1.5 1.5 0 0018.5 4h-13A1.5 1.5 0 004 5.5V16z"/><path d="M12 6v7M9.5 10.5L12 8l2.5 2.5"/></svg></span><div>导入备份<span class="info">替换当前数据为备份文件内容</span></div></div>
        <div class="right">›</div>
      </div>
      <input type="file" id="backupInput" accept=".json" style="display:none" onchange="importBackup(event)">
    </div>
    <div class="settings-group">
      <div class="settings-item">
        <div class="left"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><rect x="5" y="8" width="14" height="11" rx="3"/><circle cx="9.5" cy="13" r="1.2"/><circle cx="14.5" cy="13" r="1.2"/><path d="M12 8V4.5M9 4.5h6M12 16v1.5"/></svg></span><div>AI 增强识别<span class="info">调用 AI 识别更精准</span></div></div>
        <div class="right"><label class="toggle"><input type="checkbox" id="aiToggle" onchange="setAiEnabled(this.checked)"><span class="slider"></span></label></div>
      </div>
      <div class="settings-item" id="apiKeyItem" onclick="configureApiKey()">
        <div class="left"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><circle cx="8" cy="15" r="4.5"/><path d="M11.5 11.5L20 3M16 7l3 3M13.5 9.5l2 2"/></svg></span><div>DeepSeek API Key</div></div>
        <div class="right" id="apiKeyStatus">未设置</div>
      </div>
    </div>
    <div class="settings-group">
      <div class="settings-item danger" onclick="clearAccountData()">
        <div class="left"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M4 7h16"/><path d="M9 7V5.5A1.5 1.5 0 0110.5 4h3A1.5 1.5 0 0115 5.5V7"/><path d="M6.5 7l1 13.5h9l1-13.5"/><path d="M10 11v5M14 11v5"/></svg></span>清除当前账户数据</div>
        <div class="right">›</div>
      </div>
      <div class="settings-item danger" onclick="clearAllData()">
        <div class="left"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M4 7h16"/><path d="M9 7V5.5A1.5 1.5 0 0110.5 4h3A1.5 1.5 0 0115 5.5V7"/><path d="M6.5 7l1 13.5h9l1-13.5"/><path d="M10 11v5M14 11v5"/></svg></span>清除所有数据</div>
        <div class="right">›</div>
      </div>
    </div>
    <div style="text-align:center; padding:20px; color:var(--text-light); font-size:12px;">
      记账 · 数据仅存储在本地
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="home" onclick="switchTab('home')">
      <span class="tab-icon">
        <svg class="i-o" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2l8.6 7.4c.25.22.4.53.4.86V20a1 1 0 01-1 1h-5.6v-5.4a1.4 1.4 0 00-1.4-1.4h-2a1.4 1.4 0 00-1.4 1.4V21H4a1 1 0 01-1-1v-8.54c0-.33.15-.64.4-.86L12 3.2z"/></svg>
        <svg class="i-f" viewBox="0 0 24 24" fill="url(#gh)"><defs><linearGradient id="gh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B93FF"/><stop offset="1" stop-color="#4F6EF7"/></linearGradient></defs><path d="M12 3.2l8.6 7.4c.25.22.4.53.4.86V20a1 1 0 01-1 1h-5.6v-5.4a1.4 1.4 0 00-1.4-1.4h-2a1.4 1.4 0 00-1.4 1.4V21H4a1 1 0 01-1-1v-8.54c0-.33.15-.64.4-.86L12 3.2z"/></svg>
      </span>首页
    </button>
    <button class="tab-btn" data-tab="history" onclick="switchTab('history')">
      <span class="tab-icon">
        <svg class="i-o" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="4.6" width="17.6" height="14.8" rx="4.4"/><path d="M7.6 9.2h8.8M7.6 12.4h8.8M7.6 15.6h5.2"/></svg>
        <svg class="i-f" viewBox="0 0 24 24" fill="url(#gl)"><defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B93FF"/><stop offset="1" stop-color="#4F6EF7"/></linearGradient></defs><path d="M7.4 21h9.2A4.4 4.4 0 0021 16.6V7.4A4.4 4.4 0 0016.6 3H7.4A4.4 4.4 0 003 7.4v9.2A4.4 4.4 0 007.4 21zM6.8 9h9.8v1.7H6.8V9zm0 3.4h9.8V14H6.8v-1.6zm0 3.4h5.6v1.6H6.8v-1.6z"/></svg>
      </span>明细
    </button>
    <button class="tab-btn" data-tab="stats" onclick="switchTab('stats')">

// ── 云端同步（通过 jizhang-api Worker + Cloudflare KV）──
var API_BASE = '/api';
var _syncing = false;

// 设备唯一 ID：每台设备生成【随机唯一 ID】，不可预测、不可伪造
// 数据隔离硬规则：不同设备（即使同型号手机）ID 不同，互相无法获取数据
// 同步码配对：用户主动生成同步码并分享给【自己的另一台设备】后，两端共用
//   同一 ID 实现实时同步；未配对的设备依然完全隔离。
var _uid = localStorage.getItem('jz_uid');
var _oldUid = null; // 旧 ID（迁移用）
if (!_uid) {
  _uid = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 6);
  try { localStorage.setItem('jz_uid', _uid); } catch(e) {}
}

async function syncFromCloud(){
  // 旧随机 ID 迁移：先拉取旧 ID 的云端数据合并进本地，再统一用指纹 ID
  if (_oldUid && _oldUid !== _uid) {
    try{
      var oldResp = await fetch(API_BASE + '/records?uid=' + encodeURIComponent(_oldUid) + '&_=' + Date.now());
      if (oldResp.ok) {
        var oldData = await oldResp.json();
        if (oldData.ok && oldData.records && oldData.records.length > 0) {
          var byId = {};
          records.forEach(function(r){ byId[r.id] = r; });
          oldData.records.forEach(function(r){ if(!byId[r.id]) byId[r.id] = r; });
          records = Object.values(byId).sort(function(a,b){ return new Date(a.date) - new Date(b.date) || a.id - b.id; });
          localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        }
      }
    }catch(e){
      console.warn('旧 ID 数据迁移拉取失败', e);
    }
    _oldUid = null;
  }
  try{
    var resp = await fetch(API_BASE + '/records?uid=' + encodeURIComponent(_uid) + '&_=' + Date.now());
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    var data = await resp.json();
    if(data.ok){
      if (data.records && data.records.length > 0) {
        // 以云端为准，完全替换本地（保证删除/编辑都能同步）
        records = data.records.slice().sort(function(a,b){ return new Date(a.date) - new Date(b.date) || a.id - b.id; });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        return true;
      } else {
        // 云端为空：本地有数据则首次上传；否则清空本地
        if (records.length > 0) {
          await syncToCloud();
        } else {
          records = [];
          localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        }
      }
    }
  }catch(e){
    console.warn('云端同步拉取失败', e);
  }
  return false;
}

async function syncToCloud(){
  if(_syncing) return;
  _syncing = true;
  try{
    await fetch(API_BASE + '/records', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ uid: _uid, records: records })
    });
  }catch(e){
    console.warn('云端同步上传失败', e);
  } finally {
    _syncing = false;
  }
}

// ── 同步码配对（用户主动绑定自己的多台设备）──
var _syncCode = localStorage.getItem('jz_sync_code') || '';

function updatePairUI(){
  var st = document.getElementById('syncPairStatus');
  var info = document.getElementById('syncPairInfo');
  if (!st || !info) return;
  if (_syncCode) {
    st.textContent = '已配对';
    info.textContent = '同步码 ' + _syncCode + ' · 点击复制';
  } else {
    st.textContent = '';
    info.textContent = '生成同步码，另一台设备输入后实时同步';
  }
}

function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(function(){});
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
  }
}

function generateSyncCode(){
  if (_syncCode) {
    copyText(_syncCode);
    showToast('同步码已复制：' + _syncCode);
    return;
  }
  // 8 位随机码（去除易混淆字符）
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code = '';
  for (var i = 0; i < 8; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
  var newUid = 'p' + code; // p 前缀 = 配对共享 ID
  fetch(API_BASE + '/records', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ uid: newUid, records: records })
  }).then(function(res){ return res.json(); }).then(function(data){
    if (data.ok) {
      _syncCode = code;
      localStorage.setItem('jz_sync_code', _syncCode);
      _uid = newUid;
      localStorage.setItem('jz_uid', _uid);
      updatePairUI();
      copyText(code);
      showToast('同步码已生成并复制：' + code);
    } else {
      showToast('生成失败，请重试');
    }
  }).catch(function(){ showToast('网络错误，请重试'); });
}

function enterSyncCode(){
  var code = prompt('输入另一台设备的同步码：');
  if (!code || !code.trim()) return;
  code = code.trim().toUpperCase();
  _syncCode = code;
  localStorage.setItem('jz_sync_code', _syncCode);
  _uid = 'p' + code;
  localStorage.setItem('jz_uid', _uid);
  showToast('正在拉取同步数据…');
  syncFromCloud().then(function(){
    renderAll();
    updatePairUI();
    showToast('同步完成');
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove('show'), 1800);
}

// ── Account filtering ──
function acctRecords(acct) {
  return records.filter(r => r.accountType === (acct || currentAccount));
}

function catInfo(name, type) {
  // Search current account first, then all accounts (for old records)
  var list = getCategories(type);
  var found = list.find(function(c) { return c.name === name; });
  if (found) return found;
  for (var acct in CATEGORIES) {
    found = CATEGORIES[acct][type].find(function(c) { return c.name === name; });
    if (found) return found;
  }
  return { name: name, icon: 'pin', color: '#9CA3AF' };
}

// ── Render Filter Bar ──
function renderFilterBar() {
  var bar = document.getElementById('filterBar');

  var seen = {};
  var allCats = getCategories('expense').concat(getCategories('income'));
  allCats.forEach(function(c) {

    seen[c.name] = true;
    chips += '<button class="filter-chip" data-filter="' + c.name + '">' + ico(c.icon) + ' ' + c.name + '</button>';

}

// ── Home Page ──
function renderHome() {
  // Account cards
  const cardsContainer = document.getElementById('accountCards');
  const now = new Date();
  const monthPrefix = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');

  cardsContainer.innerHTML = ['personal', 'work'].map(acct => {
    const acctRecords = records.filter(r => r.accountType === acct);
    const monthRecords = acctRecords.filter(r => r.date.startsWith(monthPrefix));
    const income = monthRecords.filter(r => r.type === 'income').reduce((s,r) => s + r.amount, 0);
    const expense = monthRecords.filter(r => r.type === 'expense').reduce((s,r) => s + r.amount, 0);
    const balance = income - expense;

    const isActive = currentAccount === acct;
    const icon = acct === 'personal' ? ico('user') : ico('work');
    const label = acct === 'personal' ? '个人账户' : '工作账户';
    const balanceColor = balance >= 0 ? 'var(--primary)' : 'var(--danger)';
    const iconColor = acct === 'personal' ? '#4F6EF7' : '#FF9F0A';

    return `
      <div class="account-card${isActive ? ' active' : ''}" onclick="setCurrentAccount('${acct}')">
        <div class="card-badge"></div>
        <div class="card-icon" style="color:${iconColor}">${icon}</div>
        <div class="card-label">${label}</div>
        <div class="card-balance" style="color:${balanceColor}">${formatMoney(balance)}</div>
        <div class="card-row">
          <span class="in">收 ${formatMoney(income)}</span>
          <span class="out">支 ${formatMoney(expense)}</span>
        </div>
      </div>
    `;
  }).join('');

  // 本月消费趋势卡：本月总支出 + 日均 + 最近7天柱状图
  const monthRecords = acctRecords().filter(r => r.date.startsWith(monthPrefix));
  const monthExpense = monthRecords.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
  const monthIncome = monthRecords.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const dayIndex = now.getDate();
  const dailyAvg = dayIndex > 0 ? monthExpense / dayIndex : 0;

  // 最近 7 天每日支出
  const bars = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const dayExpense = monthRecords.filter(r => r.type === 'expense' && r.date === key).reduce((s, r) => s + r.amount, 0);
    bars.push({ key, dayExpense, isToday: i === 0 });
  }
  const maxBar = Math.max(...bars.map(b => b.dayExpense), 1);
  const maxBarHuman = maxBar < 1 ? 1 : maxBar;

  const trendCard = document.getElementById('trendCard');
  trendCard.innerHTML = `
    <div class="trend-card">
      <div class="trend-top">
        <span class="trend-amount">${formatMoney(monthExpense)}</span>
        <span class="trend-unit">本月支出</span>
      </div>
      <div class="trend-sub">
        <span>日均 <b>${formatMoney(dailyAvg)}</b></span>
        <span>收入 <b style="color:var(--success)">${formatMoney(monthIncome)}</b></span>
        <span>${dayIndex} / ${daysInMonth} 天</span>
      </div>
      <div class="trend-chart">
        ${bars.map(b => {
          const h = b.dayExpense > 0 ? Math.max((b.dayExpense / maxBarHuman) * 100, 6) : 3;
          return `
            <div class="trend-col${b.isToday ? ' today' : ''}">
              <div class="trend-amt">${b.dayExpense > 0 ? formatMoney(b.dayExpense).replace('¥', '') : ''}</div>
              <div class="trend-bar-wrap"><div class="trend-bar" style="height:${h}%"></div></div>
              <div class="trend-day">${parseInt(b.key.slice(8))}</div>
            </div>`;
        }).join('')}
      </div>
    </div>`;
}

function generateStats() {
  const start = document.getElementById('statsDateStart').value;
  const end = document.getElementById('statsDateEnd').value;
  if (!start || !end) { showToast('请选择日期范围'); return; }
  if (start > end) { showToast('开始日期不能晚于结束日期'); return; }

  const periodRecords = records.filter(r =>
    r.accountType === currentAccount && r.date >= start && r.date <= end
  );
  const expenses = periodRecords.filter(r => r.type === 'expense');
  const incomes = periodRecords.filter(r => r.type === 'income');
  const totalExpense = expenses.reduce((s,r) => s + r.amount, 0);
  const totalIncome = incomes.reduce((s,r) => s + r.amount, 0);

  const isPersonal = currentAccount === 'personal';
  const label = isPersonal ? '个人' : '工作';

  let html = buildStatsBody(totalExpense, totalIncome, periodRecords.length, expenses, 'expense');

  if (periodRecords.length > 0) {
    html += `
      <div style="padding:0 16px 16px;">
        <button class="quick-btn income" style="width:100%;background:var(--primary);" onclick="exportStatsResult('${start}', '${end}')">
          ${ico('export')} 导出${label}汇总报表
        </button>
      </div>`;
  }

  document.getElementById('statsResult').innerHTML = html;
  // 绘制饼图
  if (totalExpense > 0) {
    var catMap = {};
    expenses.forEach(function(r) { catMap[r.category] = (catMap[r.category] || 0) + r.amount; });
    drawDonutChart(catMap, totalExpense);
  }
}

async function exportStatsResult(start, end) {
  const periodRecords = records.filter(r => r.accountType === currentAccount && r.date >= start && r.date <= end);
  if (periodRecords.length === 0) { showToast('没有数据可导出'); return; }
  const label = currentAccount === 'personal' ? '个人' : '工作';
  const filename = label + '账户报表_' + start + '_' + end + '.csv';
  const expenses = periodRecords.filter(r => r.type === 'expense');
  const incomes = periodRecords.filter(r => r.type === 'income');
  const totalExpense = expenses.reduce((s,r) => s + r.amount, 0);
  const totalIncome = incomes.reduce((s,r) => s + r.amount, 0);
  const balance = totalIncome - totalExpense;
  let csv = '\ufeff';
  csv += label + '账户财务报表\n';
  csv += '\n';
  csv += '日期范围,,' + start + ' 至 ' + end + '\n';
  csv += '总收入,,' + totalIncome.toFixed(2) + '\n';
  csv += '总支出,,' + totalExpense.toFixed(2) + '\n';
  csv += '结余,,' + balance.toFixed(2) + '\n';
  csv += '总笔数,,' + periodRecords.length + '\n';
  csv += '\n';
  csv += '日期,类型,分类,金额,备注\n';
  const sorted = [...periodRecords].sort((a,b) => new Date(a.date) - new Date(b.date));
  sorted.forEach(r => { const t = r.type === 'expense' ? '支出' : '收入'; csv += r.date + ',' + t + ',' + r.category + ',' + r.amount.toFixed(2) + ',' + (r.note || '') + '\n'; });
  const catMap = {};
  expenses.forEach(r => { catMap[r.category] = (catMap[r.category] || 0) + r.amount; });
  if (Object.keys(catMap).length > 0) {
    csv += '\n支出分类汇总\n';
    csv += '分类,金额,占比\n';
    const sc = Object.entries(catMap).sort((a,b) => b[1] - a[1]);
    sc.forEach(([cat, amt]) => { const pct = totalExpense > 0 ? (amt / totalExpense * 100).toFixed(1) : 0; csv += cat + ',' + amt.toFixed(2) + ',' + pct + '%\n'; });
  }
  csv += '\n';
  csv += '合计,收入:' + totalIncome.toFixed(2) + ',支出:' + totalExpense.toFixed(2) + ',结余:' + balance.toFixed(2) + '\n';
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  if (navigator.share && navigator.canShare) {
    const file = new File([blob], filename, { type: 'text/csv' });
    const data = { files: [file], title: filename };
    if (navigator.canShare(data)) { try { await navigator.share(data); showToast('分享成功'); return; } catch (e) { if (e.name === 'AbortError') return; } }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('已下载' + filename);
}
function buildStatsBody(totalExpense, totalIncome, count, expenses, catType) {
  let html = `
    <div class="stats-header">
      <div class="stat-item">
        <div class="val">${formatMoney(totalExpense)}</div>
        <div class="lbl">总支出</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <div class="val" style="color:var(--success)">${formatMoney(totalIncome)}</div>
        <div class="lbl">总收入</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <div class="val">${count}</div>
        <div class="lbl">笔数</div>
      </div>
    </div>`;

  // Category breakdown
  const catMap = {};
  expenses.forEach(r => { catMap[r.category] = (catMap[r.category] || 0) + r.amount; });
  const sorted = Object.entries(catMap).sort((a,b) => b[1] - a[1]);
  const maxAmount = sorted.length > 0 ? sorted[0][1] : 1;

  html += `<div class="chart-container"><div class="chart-title">支出分类排行</div>`;
  if (sorted.length === 0) {
    html += `<div class="stat-empty">暂无支出数据</div>`;
  } else {
    html += `<div class="cat-rank" style="margin:0;">`;
    const barColors = ['#F56C6C','#E6A23C','#409EFF','#67C23A','#8B5CF6','#FF6B9D','#06B6D4','#F472B6','#10B981','#9CA83F'];
    sorted.forEach(([cat, amt], i) => {
      const info = catInfo(cat, catType);
      const pct = totalExpense > 0 ? Math.round(amt / totalExpense * 100) : 0;
      const w = Math.max((amt / maxAmount) * 100, 8);
      html += `
        <div class="cat-rank-item">
          <span style="font-size:22px;color:${info.color}">${ico(info.icon)}</span>
          <span style="font-size:14px;min-width:40px">${cat}</span>
          <div class="cat-rank-bar-bg">
            <div class="cat-rank-bar" style="width:${w}%;background:${barColors[i%barColors.length]}"></div>
          </div>
          <span class="cat-rank-amount">${formatMoney(amt)}</span>
          <span class="cat-rank-pct">${pct}%</span>
        </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  // 支出分类饼图
  if (sorted.length > 0 && totalExpense > 0) {
    html += `
    <div class="chart-container">
      <div class="chart-title">支出占比</div>
      <div style="text-align:center;padding:10px 0;">
        <canvas id="pieChart" width="260" height="260" style="max-width:100%;"></canvas>
      </div>
    </div>`;
  }
  return html;
}

function drawDonutChart(catMap, totalExpense) {
  var canvas = document.getElementById('pieChart');
  if (!canvas || totalExpense <= 0) return;
  var ctx = canvas.getContext('2d');
  var w = canvas.width, h = canvas.height;
  var cx = w / 2, cy = h / 2, r = Math.min(cx, cy) - 20, ir = r * 0.55; // 内半径（环形）
  ctx.clearRect(0, 0, w, h);
  var entries = Object.entries(catMap).sort(function(a,b) { return b[1] - a[1]; });
  if (entries.length === 0) return;
  var colors = ['#F56C6C','#E6A23C','#409EFF','#67C23A','#8B5CF6','#FF6B9D','#06B6D4','#F472B6','#10B981','#9CA83F','#F97316','#14B8A6'];
  var total = totalExpense;
  var startAngle = -Math.PI / 2;
  entries.forEach(function(e, i) {
    var pct = e[1] / total;
    var endAngle = startAngle + pct * 2 * Math.PI;
    ctx.beginPath();
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.arc(cx, cy, ir, endAngle, startAngle, true);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    // 标签
    if (pct >= 0.03) {
      var mid = startAngle + pct * Math.PI;
      var lx = cx + Math.cos(mid) * (r + 14);
      var ly = cy + Math.sin(mid) * (r + 14);
      ctx.fillStyle = '#333';
      ctx.font = '11px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      var label = e[0] + ' ' + Math.round(pct * 100) + '%';
      ctx.fillText(label, lx, ly);
    }
    startAngle = endAngle;
  });
  // 中心文字
  ctx.fillStyle = '#303133';
  ctx.font = 'bold 18px -apple-system, sans-serif';
  ctx.textAlign = 'center';

// ── Export via Web Share API ──
async function exportAccount(acct) {
  let exportRecords;
  let filename;
  if (acct === 'all') { exportRecords = [...records]; filename = '全部账单.csv'; }
  else { exportRecords = records.filter(r => r.accountType === acct); filename = (acct === 'personal' ? '个人账单' : '工作账单') + '.csv'; }
  if (exportRecords.length === 0) { showToast('没有数据可导出'); return; }

  const acctLabel = acct === 'all' ? '全部' : (acct === 'personal' ? '个人' : '工作');
  const totalIncome = exportRecords.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
  const totalExpense = exportRecords.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
  const balance = totalIncome - totalExpense;

  let csv = '\\ufeff';
  csv += acctLabel + '账户财务报表\n';
  csv += '\n';
  csv += '总计收入,,' + totalIncome.toFixed(2) + '\n';
  csv += '总计支出,,' + totalExpense.toFixed(2) + '\n';
  csv += '结余,,' + balance.toFixed(2) + '\n';
  csv += '总笔数,,' + exportRecords.length + '\n';
  csv += '\n';

  const sorted = [...exportRecords].sort((a,b) => new Date(a.date) - new Date(b.date));
  csv += '日期,账号,类型,分类,金额,备注\n';
  sorted.forEach(r => {
    const acctName = r.accountType === 'work' ? '工作' : '个人';
    const typeName = r.type === 'expense' ? '支出' : '收入';
    csv += r.date + ',' + acctName + ',' + typeName + ',' + r.category + ',' + r.amount.toFixed(2) + ',' + (r.note || '') + '\n';
  });

  const catMap = {};
  exportRecords.filter(r => r.type === 'expense').forEach(r => { catMap[r.category] = (catMap[r.category] || 0) + r.amount; });
  const catKeys = Object.keys(catMap);
  if (catKeys.length > 0) {
    csv += '\n支出分类汇总\n';
    csv += '分类,金额,占比\n';
    const sortedCat = Object.entries(catMap).sort((a,b) => b[1] - a[1]);
    sortedCat.forEach(([cat, amt]) => {
      const pct = totalExpense > 0 ? (amt / totalExpense * 100).toFixed(1) : 0;
      csv += cat + ',' + amt.toFixed(2) + ',' + pct + '%\n';
    });
  }

  csv += '\n';
  csv += '合计,收入:' + totalIncome.toFixed(2) + ',支出:' + totalExpense.toFixed(2) + ',结余:' + balance.toFixed(2) + '\n';

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  if (navigator.share && navigator.canShare) {
    const file = new File([blob], filename, { type: 'text/csv' });
    const data = { files: [file], title: filename };
    if (navigator.canShare(data)) { try { await navigator.share(data); showToast('分享成功'); return; } catch (e) { if (e.name === 'AbortError') return; } }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('已下载' + filename);
}

var _sd = {};
document.addEventListener('touchstart',function(e){
  var ct=e.target.closest('.swipe-container');if(!ct)return;
  _sd[ct.dataset.id]={sx:e.touches[0].clientX,sy:e.touches[0].clientY,moved:false};
},{passive:true});
document.addEventListener('touchmove',function(e){
  var ct=e.target.closest('.swipe-container');if(!ct||!_sd[ct.dataset.id])return;
  var d=_sd[ct.dataset.id],dx=e.touches[0].clientX-d.sx,dy=e.touches[0].clientY-d.sy;
  if(Math.abs(dy)>Math.abs(dx)&&!d.moved)return;
  if(Math.abs(dx)<15&&!d.moved)return;
  e.preventDefault();d.moved=true;
  var cc=ct.querySelector('.swipe-content');
  if(dx<0)cc.style.transform='translateX('+Math.max(dx,-144)+'px)';
  else if(cc.style.transform){var cur=parseFloat(cc.style.transform.replace('translateX(','').replace('px)',''))||0;cc.style.transform='translateX('+Math.min(cur+dx*0.3,0)+'px)';}
},{passive:false});
document.addEventListener('touchend',function(e){
  var ct=e.target.closest('.swipe-container');if(!ct||!_sd[ct.dataset.id])return;
  var d=_sd[ct.dataset.id],cc=ct.querySelector('.swipe-content');
  // If tapping on edit/delete button, let the button handle it
  if(e.target.closest('.swipe-btn')){delete _sd[ct.dataset.id];return;}
  if(d.moved){
    var tx=cc.style.transform?parseFloat(cc.style.transform.replace('translateX(','').replace('px)','')):0;
    document.querySelectorAll('.swipe-content.swiped').forEach(function(el){if(el!==cc)el.classList.remove('swiped');});
    cc.classList.toggle('swiped',tx<-72);cc.style.transform='';
    // Mark that this was a swipe — prevents synthetic click from showing detail
    ct.dataset.swipePrevent = '1';
  }else{
    // Check if there was significant movement (scroll, diagonal swipe, etc.) — don't treat as tap
    var dx = e.changedTouches[0].clientX - d.sx;
    var dy = e.changedTouches[0].clientY - d.sy;
    var dist = Math.sqrt(dx*dx + dy*dy);
    if (dist <= 15) {
      if(cc.classList.contains('swiped'))cc.classList.remove('swiped');
      else showRecordDetail(parseInt(ct.dataset.id));
    }
  }
  delete _sd[ct.dataset.id];
});
// Capture-phase click handler — prevents synthetic clicks after swipe
document.addEventListener('click',function(e){
  var ct=e.target.closest('.swipe-container');
  if(ct&&ct.dataset.swipePrevent){
    delete ct.dataset.swipePrevent;
    e.stopPropagation();
    return;
  }
  if(!ct)document.querySelectorAll('.swipe-content.swiped').forEach(function(el){el.classList.remove('swiped');});
},true);

 // ── URL Scheme: 快捷指令 / Shortcuts 传参自动记账 ──
 function aiParseText(text) {
   var result = { amount: 0, category: null, note: '', type: 'expense', date: null, accountType: 'personal' };
   if (!text) return result;
 
   // 1) 提取金额
   var amtMatch = text.match(/[¥￥]\s*([\d,]+\.?\d*)/) ||
                 text.match(/([\d,]+\.?\d*)\s*元/) ||
                 text.match(/合计\s*([\d,]+\.?\d*)/) ||
                 text.match(/金额\s*([\d,]+\.?\d*)/) ||
                 text.match(/消费\s*([\d,]+\.?\d*)/) ||
                 text.match(/支付\s*([\d,]+\.?\d*)/) ||
                 text.match(/收入\s*([\d,]+\.?\d*)/) ||
                 text.match(/实付\s*([\d,]+\.?\d*)/) ||
                 text.match(/小计\s*([\d,]+\.?\d*)/) ||
                 text.match(/总计\s*([\d,]+\.?\d*)/) ||
                 text.match(/([\d]+\.\d{2})/);
   if (amtMatch) result.amount = parseFloat(amtMatch[1].replace(/,/g, ''));
 
   // 2) 判断收支类型 - 仅做基础提示，详细分类交给 DeepSeek
   if (/工资|收入|报销|兼职|理财|退款|结余|收到|利息|奖金|返现|分红|劳务/.test(text)) result.type = 'income';
   result.category = getCategories(result.type)[0].name;
   result.note = '';

   return result;
}

// ── AI 增强识别配置 ──
var DEEPSEEK_API_URL = 'https://api.deepseek.com/chat/completions';

function getAiEnabled() {
  return localStorage.getItem('ai_enhance_enabled') !== 'false';
}
function setAiEnabled(val) {
  localStorage.setItem('ai_enhance_enabled', val ? 'true' : 'false');
  updateApiKeyItem();
}
function getApiKey() { return localStorage.getItem('deepseek_api_key') || ''; }
function configureApiKey() {
  var k = getApiKey();
  var key = prompt('DeepSeek API Key（sk- 开头）', k);
  if (key === null) return;
  key = key.trim();
  if (key && !key.startsWith('sk-')) { showToast('格式不对，需 sk- 开头'); return; }
  if (key) { localStorage.setItem('deepseek_api_key', key); showToast('Key 已保存'); }
  else { localStorage.removeItem('deepseek_api_key'); showToast('Key 已清除'); }
  updateApiKeyStatus();
}
function updateApiKeyStatus() {
  var el = document.getElementById('apiKeyStatus');
  if (el) el.textContent = getApiKey() ? '已设置 ✓' : '未设置';
}
function updateAiToggle() {
  var el = document.getElementById('aiToggle');
  if (el) el.checked = getAiEnabled();
  updateApiKeyItem();
}
function updateApiKeyItem() {
  var el = document.getElementById('apiKeyItem');
  if (el) el.style.display = getAiEnabled() ? '' : 'none';
}

async function callDeepSeekParse(text) {
  var apiKey = getApiKey();
  if (!apiKey) return { error: '未配置 API Key' };
  var prompt = '你是一个专业的智能记账助手，请分析OCR文字提取交易信息。\n\n【核心规则】\n1. 金额：从文字中提取实际交易金额\n2. 日期：不要从OCR文字中提取日期，始终使用当前日期\n3. 分类（注意分类随账户类型变化）：\n   - 当 accountType = "work" 时，category 只能从以下选：餐饮/飞机/高铁/网约车/购物/娱乐/酒店/通讯/医疗/其他\n   - 当 accountType = "personal" 时，category 只能从以下选：餐饮/交通/购物/超市/通讯/医疗/教育/信用卡/保险/住房/娱乐/人情/宠物/其他\n   - 映射规则：滴滴/网约车→网约车，高铁/动车→高铁，飞机/机票→飞机，酒店/宾馆/住宿→酒店，加油/打车/地铁→交通（personal）\n4. 账户类型（严格执行）：\n   - accountType = "work" 的情况（工作账户，用于差旅报销）：\n     * 任何出行相关的交易：滴滴出行、T3出行、曹操出行、哈啰、花小猪、高德打车、首汽约车等网约车 → 同时设置 category="网约车"\n     * 12306、高铁、动车、火车、机票、飞机、航空公司 → 同时设置 category="高铁"或"飞机"\n     * 酒店、宾馆、住宿（任何与住店相关的消费）→ 同时设置 category="酒店"\n     * 涉及出差、报销、公务、公司、单位、项目、商务、会议、团建、办公用品\n   - accountType = "personal" 的情况（个人账户，日常消费）：\n     * 餐饮美食：餐厅、外卖、奶茶、咖啡、麦当劳、肯德基、星巴克、火锅、面包店等所有吃的东西 → category="餐饮"\n     * 购物消费：淘宝、京东、拼多多、抖音、商场、超市、便利店、衣服、日用品等 → category="购物"或"超市"\n     * 网约车/打车（非工作场景）→ category="交通"\n     * 生活服务：话费、水电、医疗、教育、娱乐、健身、电影 → 对应分类\n   记住：只有差旅出行类的才归work，其他所有日常消费一律归personal\n5. 备注：准确识别真正的商家（银行名称只是付款卡，支付宝/微信只是支付方式，不是商家），备注格式为"商家名 - 商品/服务"（如"滴滴出行 - 快车"、"星巴克 - 拿铁"、"饿了么 - 午餐"）\n6. 收支类型：支出为expense，工资/理财/退款/红包等为income\n\n只返回JSON。JSON格式：{"type":"expense/income","amount":数字,"category":"分类","note":"商家名 - 商品","accountType":"personal/work"}\n\nOCR文字：' + text;
  try {
    var resp = await fetch(DEEPSEEK_API_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: [{role:'system',content:'你是记账助手。银行和支付平台不是商家。只返回JSON。'},{role:'user',content:prompt}],
        temperature: 0.1, max_tokens: 500
      })
    });
    if (!resp.ok) return { error: 'API请求失败 ('+resp.status+')' };
    var data = await resp.json();
    var c = data.choices[0].message.content.trim().replace(/^\\(?:json)?\s*/i,'').replace(/\s*\\$/i,'');
    var parsed = JSON.parse(c);
    return {
      type: parsed.type||'expense',
      amount: parsed.amount||0,
      category: parsed.category||'其他',
      note: parsed.note||'',
      accountType: parsed.accountType||'personal'
    };
  } catch(e) { return { error: 'AI解析失败: '+e.message }; }
}

function handleUrlParams() {
  var p = new URLSearchParams(window.location.search);
  if (p.get('action') === 'add') {
    var amount = parseFloat(p.get('amount'));
    if (!amount || amount <= 0) return;
    var type = p.get('type') === 'income' ? 'income' : 'expense';
    var category = p.get('category') || getCategories(type)[0].name;
    var note = p.get('note') || '';
    var acct = p.get('account') || currentAccount;
    var dateVal = p.get('date') || getLocalDateStr();

    if (acct && acct !== currentAccount) setCurrentAccount(acct);

    if (window.history && window.history.replaceState) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    openModal(type);
    document.getElementById('amountInput').value = amount;
    document.getElementById('noteInput').value = note;
    document.getElementById('dateInput').value = dateVal;
    document.getElementById('saveBtn').disabled = false;
    selectedCategory = category;
    renderCategoryGrid();
    setTimeout(function() { document.getElementById('amountInput').focus(); }, 100);
    if (p.get('autoSave') === '1') {
      setTimeout(saveRecord, 200);
    }
    return;
  }

  // ocr=：快捷指令 OCR 识别（AI 优先，本地备选）
  if (p.get('ocr')) {
    (async function() {
      var text = decodeURIComponent(p.get('ocr') || '');
      if (!text) return;
      if (window.history && window.history.replaceState) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
      if (getAiEnabled() && getApiKey()) {
        showToast('🤖 AI 识别中...');
        var r = await callDeepSeekParse(text);
        if (r && !r.error) {
          var type = r.type || 'expense';
          var cat = r.category || getCategories(type)[0].name;
          var ac = r.accountType || 'personal';
          modalAccount = ac; openModal(type);
          if (r.amount > 0) { document.getElementById('amountInput').value = r.amount; document.getElementById('saveBtn').disabled = false; }
          document.getElementById('noteInput').value = r.note;
          selectedCategory = cat; renderCategoryGrid();
          showToast('✅ AI 识别完成，请确认后保存');
          return;
        }
      }
      var result = aiParseText(text);
      var type = result.type || 'expense';
      var cat = result.category || getCategories(type)[0].name;
      var ac = result.accountType || 'personal';
      modalAccount = ac; openModal(type);
      if (result.amount > 0) { document.getElementById('amountInput').value = result.amount; document.getElementById('saveBtn').disabled = false; }
      document.getElementById('noteInput').value = result.note;
      selectedCategory = cat; renderCategoryGrid();
      showToast('✅ 识别完成，请确认后保存');
    })();
    return;
  }
}

// ── Init ──
document.getElementById('dateInput').value = getLocalDateStr();
(async function(){
  // 先拉取云端记录合并，再渲染（保证多端数据一致）
  await syncFromCloud();
  renderAll();
  updateAiToggle();
  updatePairUI();
  handleUrlParams();
})();
// 切回前台时自动同步（多端实时性）
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible') {
    syncFromCloud().then(function(){ renderAll(); });
  }
});
</script>
